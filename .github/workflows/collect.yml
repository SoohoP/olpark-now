name: collect-parking

on:
  schedule:
    # GitHub 예약 실행은 자주 건너뛰므로, 한 번 실행되면 약 5시간 40분 동안
    # 10분마다 직접 수집한다. 예약은 다음 실행을 이어 붙이는 용도.
    - cron: "7-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# 동시에 하나만 실행. 실행 중이면 다음 예약은 대기했다가 이어서 시작한다.
concurrency:
  group: collect-parking
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Collect every 10 minutes
        run: |
          git config user.name "olpark-bot"
          git config user.email "olpark-bot@users.noreply.github.com"
          END=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            # 같은 10분 구간을 이미 기록했으면 건너뛴다
            git pull -q --rebase origin main || true
            SLOT=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M' | sed 's/.$//')
            if ! grep -q "^${SLOT}" data/parking_log.csv 2>/dev/null; then
              python3 collector/collect.py
              git add data/parking_log.csv
              if ! git diff --cached --quiet; then
                git commit -q -m "data: parking $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
                for i in 1 2 3; do
                  git pull -q --rebase origin main && git push -q origin HEAD:main && break
                  sleep 5
                done
              fi
            fi
            # 다음 10분 경계(+20초)까지 대기
            NOW=$(date +%s)
            sleep $(( 600 - NOW % 600 + 20 ))
          done
