name: collect-parking

on:
  schedule:
    # 10분 간격. 정각 몰림을 피하려고 7분부터 시작 (UTC 기준, KST도 같은 분)
    - cron: "7-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-parking
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Collect one sample
        run: python3 collector/collect.py

      - name: Commit
        run: |
          git config user.name "olpark-bot"
          git config user.email "olpark-bot@users.noreply.github.com"
          git add data/parking_log.csv
          git diff --cached --quiet && exit 0
          git commit -m "data: parking $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
